<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jonás López Islas — Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #1a1a1a;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      display: flex;
      justify-content: space-between;
      padding: 22px 60px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .nav-links { display: flex; gap: 32px; }
    .nav-links a { text-decoration: none; color: #888; }
    .nav-links a:hover { color: #000; }

    .nav-right { display: flex; gap: 20px; align-items: center; }

    /* HERO */
    .hero {
      text-align: center;
      padding: 60px;
      background: #fff;
    }

    .hero-name {
      font-size: clamp(64px, 10vw, 120px);
      font-weight: 900;
      margin-bottom: 40px;
    }

    /* CARDS */
    .cards-wrapper {
      width: 100%;
      max-width: 700px;
      height: 260px;
      position: relative;
      margin: auto;
    }

    .card {
      position: absolute;
      width: 180px;
      height: 180px; /* CUADRADAS */
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.13);
      cursor: grab;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card.is-dragging {
      cursor: grabbing;
      transform: scale(1.05);
    }

    /* OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .overlay.active { display: flex; }

    .overlay img {
      max-width: 80%;
      border-radius: 12px;
    }

  </style>
</head>

<body>

<nav>
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Work</a>
  </div>

  <div class="nav-right">
    <span>Jonás López</span>
  </div>
</nav>

<section class="hero">
  <h1 class="hero-name">Jonás López</h1>

  <div class="cards-wrapper" id="cardsWrapper">
    <div class="card"><img></div>
    <div class="card"><img></div>
    <div class="card"><img></div>
    <div class="card"><img></div>
  </div>
</section>

<div class="overlay" id="overlay">
  <img id="overlayImg">
</div>

<script>

// POSICIONES BASE
const BASE = [
  { left: 50, top: 20, rot: -8 },
  { left: 180, top: 5, rot: -3 },
  { left: 315, top: 5, rot: 3 },
  { left: 445, top: 20, rot: 8 },
];

// IMÁGENES DISPONIBLES
const imagePool = [
  "img/foto1.png",
  "img/foto2.png",
  "img/foto3.png",
  "img/foto4.png",
  "img/foto5.png",
  "img/foto6.png",
  "img/foto7.png",
];

// MEZCLAR
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

shuffle(imagePool);

const cards = document.querySelectorAll(".card");

// ASIGNAR IMÁGENES SIN REPETIR
cards.forEach((card, i) => {
  const img = card.querySelector("img");
  img.src = imagePool[i];

  card.style.left = BASE[i].left + "px";
  card.style.top = BASE[i].top + "px";
  card.style.transform = `rotate(${BASE[i].rot}deg)`;

  // CLICK → EXPANDIR
  card.addEventListener("click", () => {
    document.getElementById("overlay").classList.add("active");
    document.getElementById("overlayImg").src = img.src;
  });
});

// CERRAR OVERLAY
document.getElementById("overlay").addEventListener("click", () => {
  document.getElementById("overlay").classList.remove("active");
});

</script>

</body>
</html>
