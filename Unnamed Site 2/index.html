<body>

  <!-- 👇 EL SCRIPT VA AQUÍ, justo antes de cerrar el </body> -->
  <script>
    const fullText = "Hola, mi nombre es Jonás, actualmente soy un estudiante de preparatoria pero tengo bases sólidas en la edición de video, imágenes, y creaciones de gráficos o animaciones.";

    const highlights = [
      { word: "edición de video",       color: "#c0392b" },
      { word: "imágenes",               color: "#c0392b" },
      { word: "gráficos o animaciones", color: "#c0392b" },
    ];

    const el = document.getElementById("bio-text");

    function renderWithHighlights(text) {
      let html = "", idx = 0;
      while (idx < text.length) {
        let matched = false;
        for (const { word, color } of highlights) {
          if (text.startsWith(word, idx)) {
            html += `<a href="#" style="color:${color};font-weight:500;text-decoration:none">${word}</a>`;
            idx += word.length; matched = true; break;
          }
        }
        if (!matched) {
          const c = text[idx];
          html += c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === "&" ? "&amp;" : c;
          idx++;
        }
      }
      return html;
    }

    let i = 0;
    const cursor = document.createElement("span");
    cursor.className = "cursor";

    function type() {
      if (i <= fullText.length) {
        el.innerHTML = renderWithHighlights(fullText.slice(0, i));
        el.appendChild(cursor);
        i++;
        const delay = Math.random() < 0.08 ? 90 + Math.random() * 70 : 22 + Math.random() * 20;
        setTimeout(type, delay);
      } else {
        setTimeout(() => cursor.remove(), 1400);
      }
    }

    setTimeout(type, 400);
	  
	  // Cuando termina el typewriter, JONÁS se vuelve rojo
setTimeout(() => {
  document.getElementById("nombre").classList.add("red");
}, 1800); // 👈 antes era 2200
  </script>

</body>
